name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            pest: '1.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            pest: '3.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            pest: '3.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            pest: '4.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: >-
          composer update
          --with "illuminate/config:${{ matrix.laravel }}"
          --with "illuminate/database:${{ matrix.laravel }}"
          --with "illuminate/filesystem:${{ matrix.laravel }}"
          --with "illuminate/http:${{ matrix.laravel }}"
          --with "illuminate/support:${{ matrix.laravel }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "pestphp/pest:${{ matrix.pest }}"
          --prefer-dist
          --no-interaction
          --no-progress

      - name: Run tests
        run: composer test

  mysql:
    runs-on: ubuntu-latest
    name: MySQL compatibility

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: review_rateable
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run MySQL compatibility tests
        env:
          REVIEW_RATEABLE_MYSQL_TESTS: true
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: review_rateable
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: vendor/bin/pest tests/MySqlCompatibilityTest.php
